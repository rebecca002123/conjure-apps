function pause(){if(state==='play'){state='paused';pauseP.classList.remove('hidden')}}
function resume(){if(state==='paused'){state='play';pauseP.classList.add('hidden');last=0}}
app.addEventListener('pointerdown',function(e){var tg=e.target;if(tg&&tg.closest&&tg.closest('button,input,.act'))return;if(boardOpen)return;e.preventDefault();ensure();if(state==='ready')start();else if(state==='play')flap();else if(state==='paused')resume();else if(state==='dead'&&performance.now()-deadAt>700){overP.classList.add('hidden');reset()}},{passive:false});
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();fn()},{passive:false})}
tap(again,function(){nameIn.blur();overP.classList.add('hidden');reset();hap('medium')});
tap(saveN,function(){pilot=clean(nameIn.value);S.set('flap.pilot',pilot);nameIn.value=pilot;if(myEntry){myEntry.n=pilot||'PILOT';saveBoard()}nameIn.blur();saveN.textContent='SAVED';hap('light');beep(720,980,0.08,'triangle',0.09);setTimeout(function(){saveN.textContent='SAVE'},1100)});
tap(openB1,openBoard);tap(openB2,function(){nameIn.blur();openBoard()});
tap(bestEl,function(){openBoard()});
tap(closeB,function(){closeBoard();hap('light')});
tap(clearB,function(){if(!clearArm){clearArm=1;clearB.textContent='TAP AGAIN TO CLEAR';hap('medium');setTimeout(function(){if(clearArm){clearArm=0;clearB.textContent='CLEAR BOARD'}},3000);return}clearArm=0;board=[];myEntry=null;saveBoard();clearB.textContent='CLEAR BOARD';renderBoard();hap('heavy');beep(300,120,0.2,'sawtooth',0.12)});
nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();pilot=clean(nameIn.value);S.set('flap.pilot',pilot);nameIn.value=pilot;if(myEntry){myEntry.n=pilot||'PILOT';saveBoard()}nameIn.blur()}});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});
window.addEventListener('blur',pause);
window.addEventListener('resize',function(){resize()});
resize();reset();raf=requestAnimationFrame(frame);
})();
</script></body></html>
