<script>
// Register the worker that makes this work offline. Failure is not fatal — the app
// still runs, it just needs a connection the first time after an update.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
// Standalone mode has no back button and no address bar. Swallow the rubber-band

document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();

<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: #0C0A16;

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Emberfall</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0C0A16;color:#F3F1FF;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;padding:calc(var(--safe-top,env(safe-area-inset-top)) + 10px) calc(var(--safe-right,env(safe-area-inset-right)) + 12px) calc(var(--safe-bottom,env(safe-area-inset-bottom)) + 14px) calc(var(--safe-left,env(safe-area-inset-left)) + 12px)}
.row{display:flex;align-items:center;gap:8px}
#hearts{display:flex;gap:3px}
#hearts svg{width:16px;height:16px;fill:#FF6A7A;filter:drop-shadow(0 0 4px rgba(255,106,122,.5))}
#hearts svg.off{fill:rgba(243,241,255,.18);filter:none}
#nw{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;min-width:40px}
#nb{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#3B3670,#8B7CFF 70%,#FFD08A)}
.btn{pointer-events:auto;width:40px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#F3F1FF;display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0}
.btn:active{background:rgba(255,255,255,.14)}
.pi{width:3px;height:12px;background:#F3F1FF;border-radius:2px;display:block}
#mu.off{color:rgba(243,241,255,.3)}
#fw{margin-top:14px;height:9px;border-radius:5px;background:rgba(255,255,255,.1);position:relative}
#fb{height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#FF6A2A,#FF9B6A,#FFD98A);transition:width .12s linear}
#fw.low #fb{animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#fl{position:absolute;top:13px;left:1px;font-size:9px;letter-spacing:2.5px;color:rgba(243,241,255,.4)}
#mid{flex:1;display:flex;align-items:center;justify-content:center}
#toast{opacity:0;transform:translateY(6px);transition:all .18s cubic-bezier(.2,.8,.2,1);font-size:14px;font-weight:600;background:rgba(12,10,22,.78);padding:9px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.12)}
#toast.on{opacity:1;transform:none}
#wr{display:flex;align-items:center;gap:9px}
#wt{font-size:9px;letter-spacing:2.5px;color:rgba(243,241,255,.4)}
#wp{display:flex;gap:5px}
.wp{width:5px;height:17px;border-radius:3px;background:rgba(255,255,255,.13)}
.wp.on{background:#C89B6A;box-shadow:0 0 6px rgba(200,155,106,.5)}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(8,6,18,.86);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);pointer-events:auto}
#ov.on{display:flex}
#ovT{font-size:31px;font-weight:800;letter-spacing:-.8px;margin:0 0 10px}
#ovB{margin:0 0 6px;font-size:15px;line-height:1.5;color:rgba(243,241,255,.68);max-width:290px}
#ovS{margin:12px 0 22px;font-size:12px;letter-spacing:1.4px;color:rgba(243,241,255,.42);text-transform:uppercase}
.big{pointer-events:auto;min-height:54px;padding:0 30px;border-radius:16px;background:#FF9B6A;color:#170D08;font-weight:700;font-size:17px;border:none;margin-bottom:12px}
.big:active{transform:scale(.97)}
.ghost{pointer-events:auto;min-height:46px;padding:0 22px;border-radius:14px;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(243,241,255,.8);font-size:15px}
.hide{display:none!important}
#flamemark{width:46px;height:46px;margin-bottom:14px}
</style></head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <div id="hearts"></div>
    <div id="nw"><div id="nb"></div></div>
    <button id="pz" class="btn" aria-label="pause"><span class="pi"></span><span class="pi"></span></button>
    <button id="mu" class="btn" aria-label="sound">&#9834;</button>
  </div>
  <div id="fw"><div id="fb"></div><div id="fl">FIRE</div></div>
  <div id="mid"><div id="toast"></div></div>
  <div id="wr"><span id="wt">WOOD</span><div id="wp"></div></div>
</div>
<div id="ov" class="on">
  <svg id="flamemark" viewBox="0 0 24 24"><path d="M12 2c1 5 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-6 .5 1.5 2 2 2 3.5S9 13 9 13c1.5-4 3-6 3-11z" fill="#FF9B6A"/></svg>
  <h1 id="ovT">Emberfall</h1>
  <p id="ovB">Hold anywhere to walk. Gather wood in the dark, carry it back to the fire. Bright flames keep the wolves out. Last until dawn.</p>
  <div id="ovS"></div>
  <button id="ovBtn" class="big">Begin the night</button>
  <button id="ovBtn2" class="ghost hide">Restart</button>
</div>
</div>
<script>
(function(){
var store={get:function(k,d){try{if(window.Conjure&&Conjure.get)return Conjure.get(k,d);var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{if(window.Conjure&&Conjure.set)Conjure.set(k,v);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hap(k){try{if(window.Conjure&&Conjure.haptic)Conjure.haptic(k)}catch(e){}}

var ac=null,muted=store.get('ember_mute',false),nbuf=null;
function ensureAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(ac.state==='suspended')ac.resume();if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}}
function tone(f,f2,dur,type,vol){if(!ac||muted)return;var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0004,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.03)}
function nz(dur,vol,freq,q){if(!ac||muted||!nbuf)return;var t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1.2;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0004,t+dur);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+dur+0.02)}

var cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
var mask=document.createElement('canvas'),mctx=mask.getContext('2d');
var gnd=document.createElement('canvas'),gctx=gnd.getContext('2d');
var W=0,H=0,dpr=1,fx=0,fy=0;
var NIGHT=150,DECAY=2.7,LOG=15,CAP=4,PSPD=108,WSPD=68;
var T=0,st=null,raf=null,last=0;
var hearts=document.getElementById('hearts'),nb=document.getElementById('nb'),fb=document.getElementById('fb'),fw=document.getElementById('fw'),wp=document.getElementById('wp'),toast=document.getElementById('toast');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovB=document.getElementById('ovB'),ovS=document.getElementById('ovS'),ovBtn=document.getElementById('ovBtn'),ovBtn2=document.getElementById('ovBtn2');

function resize(){
  var r=document.getElementById('app').getBoundingClientRect();
  W=Math.max(240,Math.floor(r.width));H=Math.max(360,Math.floor(r.height));
  dpr=Math.min(2,window.devicePixelRatio||1);
  cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';
  mask.width=W*dpr;mask.height=H*dpr;
  gnd.width=W*dpr;gnd.height=H*dpr;
  fx=W/2;fy=H*0.53;
  makeGround();
}
function makeGround(){
  gctx.setTransform(dpr,0,0,dpr,0,0);
  gctx.fillStyle='#0E0B18';gctx.fillRect(0,0,W,H);
  var i,x,y;
  gctx.fillStyle='#15111F';
  for(i=0;i<70;i++){x=Math.random()*W;y=Math.random()*H;gctx.beginPath();gctx.ellipse(x,y,18+Math.random()*40,10+Math.random()*22,Math.random()*3,0,6.3);gctx.fill()}
  var g=gctx.createRadialGradient(fx,fy,4,fx,fy,90);g.addColorStop(0,'#2A1D18');g.addColorStop(1,'rgba(42,29,24,0)');gctx.fillStyle=g;gctx.beginPath();gctx.arc(fx,fy,90,0,6.3);gctx.fill();
  for(i=0;i<260;i++){x=Math.random()*W;y=Math.random()*H;var h=3+Math.random()*6;gctx.strokeStyle='rgba('+(40+Math.random()*40|0)+','+(55+Math.random()*45|0)+','+(48+Math.random()*30|0)+',0.75)';gctx.lineWidth=1;gctx.beginPath();gctx.moveTo(x,y);gctx.lineTo(x+(Math.random()-0.5)*4,y-h);gctx.stroke()}
  for(i=0;i<40;i++){x=Math.random()*W;y=Math.random()*H;gctx.fillStyle='rgba(90,86,104,0.35)';gctx.beginPath();gctx.arc(x,y,1+Math.random()*2,0,6.3);gctx.fill()}
}

function reset(){
  st={mode:'menu',t:0,fuel:100,hp:3,carry:0,inv:0,px:fx+34,py:fy+46,tx:null,ty:null,face:0,walk:0,wolves:[],wood:[],emb:[],spawnT:7,woodT:0,gustT:24,feed:0,shake:0,crackT:1,warnT:0};
  for(var i=0;i<7;i++)spawnWood();
  drawHearts();hudUpd();
}
function lightR(){return 62+st.fuel*1.12}
function spawnWood(){
  for(var k=0;k<40;k++){
    var x=18+Math.random()*(W-36),y=26+Math.random()*(H-72);
    if(Math.hypot(x-fx,y-fy)>108){st.wood.push({x:x,y:y,a:Math.random()*3.14});return}
  }
  st.wood.push({x:18+Math.random()*(W-36),y:26+Math.random()*(H-72),a:0});
}
function spawnWolf(){
  var side=Math.floor(Math.random()*4),x,y;
  if(side===0){x=Math.random()*W;y=-24}else if(side===1){x=Math.random()*W;y=H+24}
  else if(side===2){x=-24;y=Math.random()*H}else{x=W+24;y=Math.random()*H}
  st.wolves.push({x:x,y:y,fear:0,stun:0,mode:'hunt',ang:0,gait:Math.random()*6});
  tone(120,58,0.5,'sawtooth',0.05);
}
function ember(x,y,n,col){for(var i=0;i<n;i++)st.emb.push({x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*8,vx:(Math.random()-0.5)*26,vy:-24-Math.random()*44,l:0.6+Math.random()*0.9,m:1.5,c:col||'#FFB067'})}

function drawHearts(){
  hearts.textContent='';
  for(var i=0;i<3;i++){
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24');if(i>=st.hp)s.setAttribute('class','off');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M12 21C6 16.6 3 13.2 3 9.7A5 5 0 0 1 12 6.6A5 5 0 0 1 21 9.7C21 13.2 18 16.6 12 21Z');
    s.appendChild(p);hearts.appendChild(s);
  }
}
var wpEls=[];
(function(){for(var i=0;i<CAP;i++){var d=document.createElement('div');d.className='wp';wp.appendChild(d);wpEls.push(d)}})();
function hudUpd(){
  nb.style.width=(st.t/NIGHT*100)+'%';
  fb.style.width=Math.max(0,st.fuel)+'%';
  if(st.fuel<26)fw.classList.add('low');else fw.classList.remove('low');
  for(var i=0;i<CAP;i++)wpEls[i].className='wp'+(i<st.carry?' on':'');
}
var toastT=0;
function say(m){toast.textContent=m;toast.classList.add('on');toastT=1.8}

function fmt(s){var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x}
function statsLine(){return 'Best '+fmt(store.get('ember_best',0))+'  \u00b7  Dawns '+store.get('ember_wins',0)}
function show(t,b,btn,btn2){ovT.textContent=t;ovB.textContent=b;ovS.textContent=statsLine();ovBtn.textContent=btn;if(btn2){ovBtn2.textContent=btn2;ovBtn2.classList.remove('hide')}else ovBtn2.classList.add('hide');ov.classList.add('on')}
function lose(msg){
  st.mode='over';
  if(st.t>store.get('ember_best',0))store.set('ember_best',Math.floor(st.t));
  hap('heavy');tone(90,40,0.9,'triangle',0.14);nz(0.5,0.1,300,0.8);
  show('Night wins',msg+' You lasted '+fmt(st.t)+' of the '+fmt(NIGHT)+' night.','Try again');
}
function win(){
  st.mode='win';st.t=NIGHT;
  store.set('ember_wins',store.get('ember_wins',0)+1);
  if(NIGHT>store.get('ember_best',0))store.set('ember_best',NIGHT);
  hap('medium');tone(523,0,0.5,'sine',0.1);setTimeout(function(){tone(659,0,0.5,'sine',0.09)},140);setTimeout(function(){tone(784,0,0.8,'sine',0.09)},290);
  show('Dawn breaks','The pack melts back into the trees. You kept the fire.','Another night');
}
function start(){ensureAudio();store.set('ember_seen',1);reset();st.mode='play';ov.classList.remove('on');last=0}
function pause(){if(st.mode!=='play')return;st.mode='pause';show('Paused','The night waits.','Resume','Restart')}

function upd(dt){
  var s=st,i,w;
  s.t+=dt;
  if(s.t>=NIGHT){win();return}
  s.fuel-=DECAY*dt;
  if(s.fuel<=0){s.fuel=0;lose('The fire went out.');return}
  var R=lightR(),prog=s.t/NIGHT;
  s.crackT-=dt;if(s.crackT<=0){s.crackT=0.5+Math.random()*1.2;nz(0.07,0.018*(0.3+s.fuel/140),500+Math.random()*1100,2)}
  if(s.fuel<26){s.warnT-=dt;if(s.warnT<=0){s.warnT=1.1;tone(300,180,0.16,'square',0.045)}}
  if(s.tx!=null){
    var dx=s.tx-s.px,dy=s.ty-s.py,d=Math.hypot(dx,dy);
    if(d>5){s.px+=dx/d*PSPD*dt;s.py+=dy/d*PSPD*dt;s.face=Math.atan2(dy,dx);s.walk+=dt*9}
  }
  s.px=Math.max(12,Math.min(W-12,s.px));s.py=Math.max(20,Math.min(H-26,s.py));
  if(s.inv>0)s.inv-=dt;
  for(i=s.wood.length-1;i>=0;i--){w=s.wood[i];
    if(s.carry<CAP&&Math.hypot(w.x-s.px,w.y-s.py)<22){s.wood.splice(i,1);s.carry++;hap('light');tone(620,880,0.09,'triangle',0.06)}}
  s.woodT-=dt;if(s.woodT<=0){s.woodT=1.3;if(s.wood.length<8)spawnWood()}
  var fd=Math.hypot(s.px-fx,s.py-fy);
  if(fd<54&&s.carry>0&&s.fuel<99.5){s.feed+=dt;if(s.feed>0.28){s.feed=0;s.carry--;s.fuel=Math.min(100,s.fuel+LOG);ember(fx,fy-6,7);hap('light');nz(0.12,0.05,320,1.4);tone(180,110,0.14,'triangle',0.05)}}else s.feed=0;
  s.gustT-=dt;
  if(s.gustT<=0){s.gustT=20+Math.random()*10;s.fuel=Math.max(1,s.fuel-9);say('A cold gust!');nz(0.7,0.07,420,0.6);hap('medium');ember(fx,fy-4,10,'#FFD08A')}
  s.spawnT-=dt;
  if(s.spawnT<=0){
    s.spawnT=Math.max(3.1,9.5-6.4*prog)*(0.8+Math.random()*0.5);
    var live=0;for(i=0;i<s.wolves.length;i++)if(s.wolves[i].mode==='hunt')live++;
    if(live<3+Math.floor(prog*4))spawnWolf();
  }
  for(i=s.wolves.length-1;i>=0;i--){
    w=s.wolves[i];
    if(w.mode==='flee'){
      var ex=w.ex-w.x,ey=w.ey-w.y,ed=Math.hypot(ex,ey)||1;
      w.x+=ex/ed*128*dt;w.y+=ey/ed*128*dt;w.ang=Math.atan2(ey,ex);
      if(w.x<-40||w.x>W+40||w.y<-40||w.y>H+40)s.wolves.splice(i,1);
      continue;
    }
    if(w.stun>0)w.stun-=dt;
    var pdx=s.px-w.x,pdy=s.py-w.y,pd=Math.hypot(pdx,pdy)||1;
    var sp=(WSPD+20*prog)*(w.stun>0?-1.5:1);
    var vx=pdx/pd*sp,vy=pdy/pd*sp;
    var wdx=w.x-fx,wdy=w.y-fy,wd=Math.hypot(wdx,wdy)||1;
    if(wd<R){var k=(1-wd/R)*(50+2.3*s.fuel);vx+=wdx/wd*k;vy+=wdy/wd*k;w.fear+=dt*(0.5+s.fuel/70)}
    else w.fear=Math.max(0,w.fear-dt*0.6);
    for(var j=0;j<s.wolves.length;j++){if(j===i)continue;var o=s.wolves[j],ox=w.x-o.x,oy=w.y-o.y,od=Math.hypot(ox,oy);if(od<22&&od>0.1){vx+=ox/od*40;vy+=oy/od*40}}
    if(w.fear>3.2){w.mode='flee';w.ex=w.x<W/2?-60:W+60;w.ey=w.y<H/2?-60:H+60;tone(200,90,0.35,'sawtooth',0.05);continue}
    w.x+=vx*dt;w.y+=vy*dt;w.gait+=dt*10;
    if(Math.abs(vx)+Math.abs(vy)>1)w.ang=Math.atan2(vy,vx);
    if(pd<19&&s.inv<=0&&w.stun<=0){
      s.hp--;s.inv=1.6;w.stun=1.1;w.fear=4;s.shake=11;drawHearts();
      hap('heavy');nz(0.3,0.12,180,0.7);tone(160,70,0.3,'square',0.09);
      var dropped=s.carry;s.carry=0;
      for(var q=0;q<dropped;q++)s.wood.push({x:s.px+(Math.random()-0.5)*40,y:s.py+(Math.random()-0.5)*40,a:Math.random()*3});
      if(s.hp<=0){lose('The pack found you in the dark.');return}
      say('Bitten! Wood dropped');
    }
  }
  for(i=s.emb.length-1;i>=0;i--){var e=s.emb[i];e.l-=dt;if(e.l<=0){s.emb.splice(i,1);continue}e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=6*dt;e.vx*=0.98}
  if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('on')}
}

function flame(x,y,w,h,col,ph){
  ctx.beginPath();ctx.moveTo(x-w,y);
  ctx.bezierCurveTo(x-w,y-h*0.55,x-w*0.5+Math.sin(ph)*w*0.6,y-h,x+Math.sin(ph)*w*0.3,y-h);
  ctx.bezierCurveTo(x+w*0.5+Math.sin(ph)*w*0.6,y-h,x+w,y-h*0.55,x+w,y);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function wolf(w,vis){
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.ang);
  var b=Math.sin(w.gait)*1.6;
  if(vis>0.02){
    ctx.globalAlpha=vis;
    ctx.fillStyle='#2B2A38';
    ctx.beginPath();ctx.ellipse(-2,0,13,7,0,0,6.3);ctx.fill();
    ctx.beginPath();ctx.ellipse(9,b*0.4,7,5.5,0,0,6.3);ctx.fill();
    ctx.fillStyle='#20202C';
    ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-22,-5+b);ctx.lineTo(-12,3);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(11,-4);ctx.lineTo(13,-9);ctx.lineTo(15,-3);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(11,4);ctx.lineTo(13,9);ctx.lineTo(15,3);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function wolfEyes(w){
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.ang);
  ctx.shadowColor='#FFC84A';ctx.shadowBlur=8;ctx.fillStyle=w.mode==='flee'?'#8FE7FF':'#FFD24A';
  ctx.beginPath();ctx.arc(12,-2.6,1.7,0,6.3);ctx.fill();
  ctx.beginPath();ctx.arc(12,2.6,1.7,0,6.3);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

function draw(){
  var s=st,i,w;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(s.shake>0){ctx.translate((Math.random()-0.5)*s.shake,(Math.random()-0.5)*s.shake);s.shake=Math.max(0,s.shake-0.45)}
  ctx.fillStyle='#08060F';ctx.fillRect(-18,-18,W+36,H+36);
  ctx.drawImage(gnd,0,0,W,H);
  var R=lightR(),fl=Math.sin(T*9)*0.5+Math.sin(T*13.7)*0.3,sz=0.5+s.fuel/100*0.5;
  ctx.strokeStyle='rgba(255,155,106,0.16)';ctx.lineWidth=1;ctx.setLineDash([5,7]);
  ctx.beginPath();ctx.arc(fx,fy,54,0,6.3);ctx.stroke();ctx.setLineDash([]);
  for(i=0;i<s.wood.length;i++){w=s.wood[i];
    ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.a);
    ctx.fillStyle='#6E5334';ctx.fillRect(-9,-2,18,3.4);
    ctx.fillStyle='#8A6842';ctx.fillRect(-6,-5.5,13,3);
    ctx.restore();
  }
  ctx.fillStyle='#33241E';
  ctx.save();ctx.translate(fx,fy);ctx.rotate(0.4);ctx.fillRect(-19,2,38,7);ctx.rotate(-0.9);ctx.fillRect(-17,1,34,6);ctx.restore();
  flame(fx,fy+2,15*sz,(30+fl*5)*sz,'#FF5A1E',T*4.1);
  flame(fx,fy+2,10*sz,(22+fl*4)*sz,'#FF9B3A',T*5.3+1);
  flame(fx,fy+1,5.5*sz,(13+fl*3)*sz,'#FFE2A0',T*6.7+2);
  for(i=0;i<s.wolves.length;i++){w=s.wolves[i];
    var d=Math.hypot(w.x-fx,w.y-fy),pv=Math.hypot(w.x-s.px,w.y-s.py);
    var vis=Math.max(1-d/(R*0.95),1-pv/70);
    wolf(w,Math.max(0,Math.min(1,vis)));
  }
  ctx.save();ctx.translate(s.px,s.py);
  var bob=Math.sin(s.walk)*1.5;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(0,9,9,3.5,0,0,6.3);ctx.fill();
  if(s.inv>0&&Math.floor(s.inv*10)%2===0)ctx.globalAlpha=0.4;
  ctx.fillStyle='#5B4EA8';ctx.beginPath();ctx.ellipse(0,0+bob*0.3,7.5,9,0,0,6.3);ctx.fill();
  ctx.fillStyle='#E8C9A6';ctx.beginPath();ctx.arc(0,-9+bob*0.4,5.2,0,6.3);ctx.fill();
  ctx.fillStyle='#8B7CFF';ctx.beginPath();ctx.arc(0,-11+bob*0.4,5.4,3.14,6.28);ctx.fill();
  if(s.carry>0){ctx.fillStyle='#8A6842';for(i=0;i<s.carry;i++)ctx.fillRect(-8+i*4,-20-bob*0.3,3,8)}
  ctx.globalAlpha=1;ctx.restore();
  var darkA=0.95;
  if(s.t>NIGHT-9)darkA=0.95-0.55*Math.min(1,(s.t-(NIGHT-9))/9);
  if(s.mode==='win')darkA=0.4;
  mctx.setTransform(dpr,0,0,dpr,0,0);mctx.globalCompositeOperation='source-over';
  mctx.clearRect(0,0,W,H);
  mctx.fillStyle='rgba(6,4,13,'+darkA+')';mctx.fillRect(0,0,W,H);
  mctx.globalCompositeOperation='destination-out';
  var g=mctx.createRadialGradient(fx,fy,0,fx,fy,R*(1+fl*0.02));
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.45,'rgba(0,0,0,0.96)');g.addColorStop(0.78,'rgba(0,0,0,0.55)');g.addColorStop(1,'rgba(0,0,0,0)');
  mctx.fillStyle=g;mctx.fillRect(0,0,W,H);
  var g2=mctx.createRadialGradient(s.px,s.py,0,s.px,s.py,62);
  g2.addColorStop(0,'rgba(0,0,0,0.85)');g2.addColorStop(0.5,'rgba(0,0,0,0.55)');g2.addColorStop(1,'rgba(0,0,0,0)');
  mctx.fillStyle=g2;mctx.fillRect(0,0,W,H);
  mctx.globalCompositeOperation='source-over';
  ctx.drawImage(mask,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  var g3=ctx.createRadialGradient(fx,fy,0,fx,fy,R*0.85);
  g3.addColorStop(0,'rgba(255,140,60,0.30)');g3.addColorStop(0.4,'rgba(255,110,40,0.12)');g3.addColorStop(1,'rgba(255,90,30,0)');
  ctx.fillStyle=g3;ctx.fillRect(0,0,W,H);
  for(i=0;i<s.emb.length;i++){var e=s.emb[i];ctx.globalAlpha=Math.max(0,e.l/e.m);ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(e.x,e.y,1.6,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  for(i=0;i<s.wolves.length;i++)wolfEyes(s.wolves[i]);
}

function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=Math.min(50,ts-last)/1000;last=ts;T+=dt;
  if(st.mode==='play'){upd(dt);hudUpd()}
  else{for(var i=st.emb.length-1;i>=0;i--){var e=st.emb[i];e.l-=dt;if(e.l<=0){st.emb.splice(i,1);continue}e.x+=e.vx*dt;e.y+=e.vy*dt}}
  draw();
}

function pt(ev){var r=cvs.getBoundingClientRect();var t=ev.touches?ev.touches[0]:ev;return{x:t.clientX-r.left,y:t.clientY-r.top}}
cvs.addEventListener('pointerdown',function(e){if(st.mode!=='play')return;ensureAudio();var p=pt(e);st.tx=p.x;st.ty=p.y;cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',function(e){if(st.mode!=='play'||st.tx==null)return;var p=pt(e);st.tx=p.x;st.ty=p.y});
function up(){st.tx=null;st.ty=null}
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);
document.addEventListener('touchmove',function(e){if(e.target===cvs)e.preventDefault()},{passive:false});

var mu=document.getElementById('mu');
function muUpd(){mu.className='btn'+(muted?' off':'');mu.textContent=muted?'\u2715':'\u266A'}
mu.addEventListener('click',function(){muted=!muted;store.set('ember_mute',muted);muUpd();if(!muted){ensureAudio();tone(700,900,0.1,'sine',0.07)}hap('light')});
document.getElementById('pz').addEventListener('click',function(){hap('light');if(st.mode==='play')pause();else if(st.mode==='pause'){st.mode='play';ov.classList.remove('on');last=0}});
ovBtn.addEventListener('click',function(){hap('medium');if(st.mode==='pause'){st.mode='play';ov.classList.remove('on');last=0}else start()});
ovBtn2.addEventListener('click',function(){hap('light');start()});
document.addEventListener('visibilitychange',function(){if(document.hidden&&st&&st.mode==='play')pause()});
window.addEventListener('resize',function(){var pf=st?{px:st.px/W,py:st.py/H}:null;resize();if(st){st.px=pf.px*W;st.py=pf.py*H}});

resize();reset();muUpd();
if(store.get('ember_seen',0)){ovB.textContent='Hold to walk. Wood in the dark, fire in the middle. Bright flames push the wolves back.';ovS.textContent=statsLine();ovBtn.textContent='Begin the night'}
else ovS.textContent=statsLine();
raf=requestAnimationFrame(frame);
})();
</script>
